<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Abhishek - Welcome back</title>
<style>
  :root{
    --bg:#0a0a0a; --card:#111; --line:#222; --ink:#fff; --ink2:#8a8a8a;
    --gym:#c8362d; --meal:#2b8f55;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:400 16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    display:grid;place-items:center;padding:24px;min-height:100dvh;
  }
  .hero{max-width:560px;width:100%}
  .brand{
    font-weight:800;font-size:12px;letter-spacing:.22em;
    color:var(--ink2);text-transform:uppercase;margin-bottom:18px;text-align:center;
  }
  h1{
    font-size:clamp(34px,8vw,52px);font-weight:900;letter-spacing:-.035em;
    line-height:1.02;margin:0 0 10px;text-align:center;
  }
  .sub{color:var(--ink2);text-align:center;margin:0 0 40px;font-size:15px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.choices{grid-template-columns:1fr}}
  .choice{
    --accent:#666;
    display:block;text-decoration:none;color:var(--ink);
    padding:28px 22px;border-radius:18px;border:2px solid var(--line);
    background:var(--card);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .choice:hover,.choice:focus-visible{
    transform:translateY(-3px);
    border-color:var(--accent);
    background:#151515;
    outline:none;
  }
  .choice .icon{font-size:38px;line-height:1;display:block;margin-bottom:16px}
  .choice h2{
    font-size:22px;font-weight:900;letter-spacing:-.02em;margin:0 0 5px;
  }
  .choice p{color:var(--ink2);font-size:13px;margin:0;line-height:1.45}
  .choice.gym{--accent:var(--gym)}
  .choice.gym .icon{color:var(--gym)}
  .choice.meal{--accent:var(--meal)}
  .choice.meal .icon{color:var(--meal)}
</style>
</head>
<body>
<div class="hero">
  <div class="brand">Abhishek</div>
  <h1>What are we doing?</h1>
  <p class="sub">Pick one. Everything saves automatically.</p>
  <div class="choices">
    <a class="choice gym" href="gym.html">
      <span class="icon">🏋️</span>
      <h2>Workout</h2>
      <p>12-week training plan, lift log, progress photos</p>
    </a>
    <a class="choice meal" href="meals.html">
      <span class="icon">🥗</span>
      <h2>Food</h2>
      <p>4-week meal plan, prep schedule</p>
    </a>
  </div>
</div>
</body>
</html>
