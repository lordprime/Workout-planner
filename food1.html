<!doctype html>

<title>Meal OS — 4-week Vegetarian Cut &amp; Gut Health</title>
<style>
:root{

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:calc(var(--nav-h) + 26px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.top{padding:14px 0 6px;border-bottom:1px solid var(--line)}

.brand{font-weight:850;font-size:23px;letter-spacing:-.02em}
.top .right{display:flex;align-items:center;gap:10px}
#sync{font-size:12px;color:var(--ink2)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line)}

.chklabel{font-size:13px;font-weight:750}

      "Grains & Pulses: 1 kg Basmati rice, 500 g Red-lentil or whole-wheat pasta, 500 g Rolled oats (Haferflocken), 250 g Red lentils (rote Linsen), 1 can Black beans, 1 can Kidney beans",
      "Gut-Health & Seeds: Chia seeds, ground flaxseeds (Leinsamen geschrotet), psyllium husk (Flohsamenschalen), raw apple cider vinegar (Apfelessig naturtrüb), fennel seeds (Fenchelsamen), cumin seeds, chamomile & peppermint tea",
      "Produce: 8 bananas, 2 bags frozen berries, fresh ginger root, lemons (4), baby spinach (500 g), broccoli (2 heads), bell peppers, tomatoes, onions, garlic, frozen mixed veggies"
    ]
  },
  budget: {
    monthlyCap: 180,
    foodTarget: 155,
    supplementsBuffer: 15,
    priceTargets: {
      "Magerquark & Natur Skyr": "Aldi/Lidl own-brand (~€0.99–€1.29 per 500 g Quark; ~€1.19–€1.49 per Skyr). Huge protein-per-euro value.",
      "Eggs (30/week)": "Buy 10-packs at Aldi/Lidl (~€2.19–€2.49/pack) = ~€7/week for 180+ g high-bioavailability protein.",
      "Tofu & Smoked Tofu": "Aldi/Lidl/DM organic 2×200 g twin-packs (~€2.19–€2.49) beat specialty health stores by 40%.",
      "Dry Soybeans, Lentils & Rice": "Buy 1–2 kg bags at Asian grocery or Kaufland (~€2.50–€3.50/kg); lasts the entire 4 weeks.",
      "Gut Teas & Spices": "Buy whole fennel seeds, cumin seeds & fresh ginger root instead of expensive 'detox' tea bags—costs under €4 for the whole month."
    }
  }
};

/* ------------------------------------------------------------------ *
 * 2. HELPERS & STATE
 * ------------------------------------------------------------------ */
const FIRST = DATA.days[0].date;
const LAST  = DATA.days[DATA.days.length - 1].date;
const byDate = d => DATA.days.find(x => x.date === d);
const fmt = d => parseDate(d).toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"short", year:"numeric"});
const shortDate = d => parseDate(d).toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"});
const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const STORE_KEY = "mealos:vegcut_gut:v1";
let state = {tab:"today", selected:DATA.start, done:{}, metrics:{}, prep:{}, budget:{spent:0}};

try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) {}

state.done    = (state.done    && typeof state.done    === "object") ? state.done    : {};
state.metrics = (state.metrics && typeof state.metrics === "object") ? state.metrics : {};
state.prep    = (state.prep    && typeof state.prep    === "object") ? state.prep    : {};
state.budget  = (state.budget  && typeof state.budget  === "object") ? state.budget  : {spent:0};
if (!["today","calendar","prep","budget","progress"].includes(state.tab)) state.tab = "today";
if (!byDate(state.selected)) state.selected = DATA.start;

function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
  const el = document.getElementById("sync");
  if (el) el.textContent = "Saved on this device";
}

function setTab(t){ state.tab = t; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function setSelected(d){ if(!byDate(d)) return; state.selected = d; state.tab = "today"; render(); window.scrollTo({top:0, behavior:"smooth"}); }

const checkKey = (d,k) => d + "|" + k;
const checked  = (d,k) => !!state.done[checkKey(d,k)];
function setChecked(d,k,v){ state.done[checkKey(d,k)] = v; save(); render(); }

function nearestDay(d){
  if (byDate(d)) return d;
  let best = FIRST, bestDiff = Infinity;
  for (const day of DATA.days){
    const diff = Math.abs(parseDate(day.date) - parseDate(d));
    if (diff < bestDiff){ bestDiff = diff; best = day.date; }
  }
  return best;
}

function currentWeekDays(d){
  const m = monday(d);
  return Array.from({length:7}, (_,i) => addDays(m,i));
}

function dayTotals(day){
  const pre = DATA.preWorkout[day.pre];
  const bf  = DATA.breakfasts[day.bf];
  const l   = DATA.mains[day.lunch];
  const dn  = DATA.mains[day.dinner];
  const sn  = DATA.snacks[day.snack];
  return {
    kcal: pre.kcal + bf.kcal + l.kcal + dn.kcal + sn.kcal,
    p:    pre.p    + bf.p    + l.p    + dn.p    + sn.p
  };
}

function progressFor(dateStr){
  const keys = ["pre","bf","lunch","dinner","snack","gut"];
  return keys.filter(k => checked(dateStr,k)).length / keys.length;
}

function weekLabel(d){
  const m = monday(d), su = addDays(m,6);
  const f = x => parseDate(x).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  return f(m) + " – " + f(su);
}

/* ------------------------------------------------------------------ *
 * 3. VIEWS
 * ------------------------------------------------------------------ */
function weekStrip(d){
  const ds = currentWeekDays(d);
  return `<div class="weekstrip">${ds.map(x => {
    const item = byDate(x);
    const cls = (x === state.selected ? " sel" : "") + (item && progressFor(x) === 1 ? " done" : "");
    const n = item ? String(item.cycleDay) : "";
    return `<button class="daybtn${cls}" data-go="${x}" ${item ? "" : "disabled"} aria-label="${escapeHtml(item ? 'Day ' + item.cycleDay : 'No plan')}">
      <span class="dot">${escapeHtml(n)}</span>
      <span class="lab">${parseDate(x).toLocaleDateString(undefined,{weekday:"short"})}</span>
    </button>`;
  }).join("")}</div>`;
}

function mealCard(day, key, title, obj, badge, gutTag){
  const isDone = checked(day.date, key);
  const list   = obj.items || [];
  const batch  = obj.batchIngredients || null;
  return `<div class="meal">
    <div class="mealhead">
      <div class="mealtitle"><h3>${escapeHtml(title)}</h3><span class="badge${gutTag ? " gut" : ""}">${escapeHtml(badge)}</span></div>
      ${obj.kcal != null ? `<div class="mealmeta">${obj.kcal} kcal<br>${obj.p} g protein</div>` : `<div class="mealmeta">0 kcal<br>Gut Clear</div>`}
    </div>
    ${list.length ? `<ul>${list.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>` : ""}
    ${batch ? `<details class="recipe"><summary>2-portion batch recipe (Tonight's dinner + Tomorrow's uni lunch)</summary>
        <div class="inside"><ul>${batch.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul></div>
      </details>` : ""}
    <label class="checkrow">
      <input type="checkbox" data-check="${key}" ${isDone ? "checked" : ""}>
      <span class="chklabel">${isDone ? "✓ Completed" : "Mark completed"}</span>
    </label>
  </div>`;
}

function todayView(){
  const d   = byDate(state.selected) || DATA.days[0];
  const pre = DATA.preWorkout[d.pre];
  const bf  = DATA.breakfasts[d.bf];
  const l   = DATA.mains[d.lunch];
  const dn  = DATA.mains[d.dinner];
  const sn  = DATA.snacks[d.snack];
  const gut = DATA.gutProtocols[d.gut];
  const tot = dayTotals(d);
  const pct = Math.round(progressFor(d.date) * 100);
  const m   = state.metrics[d.date] || {};

  return `
  <div class="weekbar">
    <button class="iconbtn" data-week="-1" aria-label="Previous week">‹</button>
    <span class="ttl">Week ${d.week} · ${weekLabel(d.date)}</span>
    <button class="iconbtn" data-week="1" aria-label="Next week">›</button>
  </div>
  ${weekStrip(d.date)}

  <div class="hero">
    <h1>Day ${d.cycleDay}</h1>
    <div class="sub">${fmt(d.date)} · <b>${escapeHtml(d.training)}</b></div>
    <div class="chips">
      <span class="chip">${tot.kcal} kcal</span>
      <span class="chip">${tot.p} g protein</span>
      <span class="chip">${pct}% done</span>
      <span class="chip">100 g soybeans/day</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b>${tot.kcal}</b><span>daily kcal</span></div>
    <div class="stat"><b>${tot.p} g</b><span>protein</span></div>
    <div class="stat"><b>${escapeHtml(d.lunch)} → ${escapeHtml(d.dinner)}</b><span>lunch / dinner</span></div>
    <div class="stat"><b>3.2 L</b><span>water + infusions</span></div>
  </div>

  <div class="card"><b>Tonight's Cook-Once-Eat-Twice Action</b>
    <p class="small muted">${escapeHtml(d.cook)}. Pack the second portion straight into your university Tupperware tonight so tomorrow morning is 100% grab-and-go.</p>
  </div>

  ${mealCard(d,"pre","04:45 AM Pre-Gym & Morning Flush",pre,d.pre,true)}
  ${mealCard(d,"bf","07:00 AM Post-Workout Breakfast",bf,d.bf,false)}
  ${mealCard(d,"lunch","12:30 PM University Lunch Box (Packed Last Night)",l,d.lunch,false)}
  ${mealCard(d,"snack","04:30 PM Probiotic Skyr & Fiber Bowl",sn,d.snack,true)}
  ${mealCard(d,"dinner","08:00 PM Dinner (Cook 2 Portions Tonight)",dn,d.dinner,false)}
  ${mealCard(d,"gut","Daily Digestive, Hot Water & Anti-Bloat Protocol",gut,"Gut & Bloat Clear",true)}

  <h2>Daily Cut &amp; Gut Tracking</h2>
  <div class="card">
    <div class="fields">
      <label class="field">Morning Weight (kg)<input type="number" step="0.1" inputmode="decimal" data-metric="weight" value="${m.weight ?? ""}" placeholder="78.0"></label>
      <label class="field">Water + Teas (L)<input type="number" step="0.1" inputmode="decimal" data-metric="water" value="${m.water ?? ""}" placeholder="3.2"></label>
      <label class="field">Protein (g)<input type="number" step="1" inputmode="numeric" data-metric="protein" value="${m.protein ?? ""}" placeholder="${tot.p}"></label>
      <label class="field">Bloat / Gut (1–5)<input type="number" min="1" max="5" step="1" inputmode="numeric" data-metric="bloat" value="${m.bloat ?? ""}" placeholder="1 = flat"></label>
    </div>
    <label class="field" style="margin-top:10px">Notes
      <textarea data-metric="notes" placeholder="Morning stomach flatness, gym energy, digestion after soybeans/Skyr">${escapeHtml(m.notes || "")}</textarea>
    </label>
  </div>
  `;
}

function calendarView(){
  const weeks = [
    ["Week 1 (Calibration)", START_DATE],
    ["Week 2 (Momentum)", addDays(START_DATE, 7)],
    ["Week 3 (Checkpoint & Carb Trim if Needed)", addDays(START_DATE, 14)],
    ["Week 4 (Peak Abdominal Definition)", addDays(START_DATE, 21)]
  ];
  return `<h2>4-Week Vegetarian Cut Calendar</h2>
  <p class="muted small">Every dinner cooks 2 portions: tonight's dinner + tomorrow's university lunch box. Tuesday adds an extra pre-badminton banana; Sunday trims carbs by ~220 kcal.</p>` +
  weeks.map(([name,start]) => {
    const ds = Array.from({length:7}, (_,i) => addDays(start,i));
    return `<div class="calendar-week"><h3>${name} · ${weekLabel(start)}</h3>
      <div class="calendar-grid">${ds.map(x => {
        const d = byDate(x);
        if (!d) return `<div class="calday"><div class="date">${shortDate(x)}</div></div>`;
        return `<div class="calday ${x === state.selected ? "today" : ""}" data-go="${x}">
          <div class="date">Day ${d.cycleDay} · ${parseDate(x).toLocaleDateString(undefined,{weekday:"short",day:"numeric"})}</div>
          <div class="train">${escapeHtml(d.training)}</div>
          <div class="mini"><b>07:00 BF</b>${escapeHtml(DATA.breakfasts[d.bf].name)}</div>
          <div class="mini"><b>12:30 Uni</b>${escapeHtml(DATA.mains[d.lunch].name)}</div>
          <div class="mini"><b>16:30 Snack</b>${escapeHtml(DATA.snacks[d.snack].name)}</div>
          <div class="mini"><b>20:00 Din</b>${escapeHtml(DATA.mains[d.dinner].name)}</div>
          <div class="mini"><b>Gut</b>${escapeHtml(DATA.gutProtocols[d.gut].name)}</div>
        </div>`;
      }).join("")}</div></div>`;
  }).join("");
}

function prepView(){
  return `<h2>Cook-Once-Eat-Twice &amp; Gut Prep System</h2>
  <p class="muted">You cook once each evening (15–25 minutes) for tonight's dinner and tomorrow's university Tupperware, plus boil <b>175 g dry soybeans</b> twice a week (Sunday &amp; Wednesday) so your daily 100 g cooked soybean portion is always ready.</p>
  <div class="gutbox"><b>Anti-Bloating Soybean &amp; Legume Rule:</b> Always soak dry soybeans for 8–12 hours, discard the soaking water, and boil thoroughly for 45–60 minutes with <b>3 slices of fresh ginger</b> and a pinch of salt. Rinse canned beans under cold water for 30 seconds. This eliminates raffinose/stachyose oligosaccharides that cause gas and lower-belly distension.</div>
  ${DATA.prep.map(p => {
    const done = !!state.prep[p.date];
    return `<div class="prepitem">
      <div class="date">${escapeHtml(p.date)} · ${escapeHtml(p.title)}</div>
      <div class="muted small">${done ? "✓ Completed" : "Scheduled"}</div>
      <ul>${p.tasks.map(t => `<li>${escapeHtml(t)}</li>`).join("")}</ul>
      <label class="togl"><input type="checkbox" data-prep="${p.date}" ${done ? "checked" : ""}> Mark prep complete</label>
    </div>`;
  }).join("")}
  <h2>All 7 Evening Batch Recipes (2 Portions Each)</h2>
  <div class="card">${Object.entries(DATA.mains).map(([k,v]) => `
    <div class="recipe"><details><summary>${k} — ${escapeHtml(v.name)} (${v.kcal} kcal · ${v.p} g protein / portion)</summary>
      <div class="inside"><ul>${v.batchIngredients.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul></div>
    </details></div>`).join("")}</div>`;
}

function budgetView(){
  const m = state.budget || {spent:0};
  const planned = DATA.budget.monthlyCap;
  const spent = Number(m.spent) || 0;
  const pct = Math.min(100, Math.round(spent / planned * 100));
  return `<h2>€180 Monthly Budget (German Supermarkets)</h2>
  <div class="stats">
    <div class="stat"><b>€${planned}</b><span>hard ceiling</span></div>
    <div class="stat"><b>€${DATA.budget.foodTarget}</b><span>food target</span></div>
    <div class="stat"><b>€${DATA.budget.supplementsBuffer}</b><span>creatine/D3 buffer</span></div>
    <div class="stat"><b>€${Math.max(0, planned - spent).toFixed(2)}</b><span>remaining</span></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><b>Actual spend this month</b><span class="kpi">€${spent.toFixed(2)}</span></div>
    <div class="budgetbar" style="margin:10px 0"><i style="width:${pct}%"></i></div>
    <div class="muted small">Vegetarian staples (Magerquark, Skyr, eggs, dry soybeans, tofu, oats, rice) easily stay around €35–€38/week at Aldi/Lidl/Kaufland.</div>
    <div class="fields" style="margin-top:12px">
      <label class="field">Total spent (€)<input type="number" step="0.01" inputmode="decimal" data-budget="spent" value="${m.spent ?? 0}"></label>
    </div>
  </div>
  <h2>Smart Shopping Rules</h2>
  <div class="card">${Object.entries(DATA.budget.priceTargets).map(([k,v]) =>
    `<p><b>${escapeHtml(k)}</b><br><span class="muted small">${escapeHtml(v)}</span></p>`).join("")}</div>
  <h2>Weekly Shopping Checklist</h2>
  ${Object.entries(DATA.shopping).map(([w,items]) => `
    <details class="card" open><summary><b>${escapeHtml(w)}</b></summary>
      <ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>
    </details>`).join("")}`;
}

function progressView(){
  const vals = DATA.days
    .map(d => (state.metrics[d.date] || {}).weight)
    .filter(v => v !== undefined && v !== null && v !== "")
    .map(Number)
    .filter(v => !isNaN(v));
  const avg = vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
  const latest = vals.length ? vals[vals.length - 1] : null;
  const KEYS = ["pre","bf","lunch","dinner","snack","gut"];
  const allMeals = DATA.days.length * KEYS.length;
  const doneMeals = DATA.days.reduce((n,d) => n + KEYS.filter(k => checked(d.date,k)).length, 0);
  const mealPct = Math.round(doneMeals / allMeals * 100);
  return `<h2>Cut &amp; Gut Progress</h2>
  <div class="stats">
    <div class="stat"><b>${mealPct}%</b><span>plan adherence</span></div>
    <div class="stat"><b>${latest ? latest.toFixed(1) : "78.0"}</b><span>latest weight kg</span></div>
    <div class="stat"><b>${avg ? avg.toFixed(1) : "—"}</b><span>avg weight kg</span></div>
    <div class="stat"><b>${Object.values(state.prep).filter(Boolean).length}</b><span>preps done</span></div>
  </div>
  <div class="card"><b>30-Day Target &amp; Adjustment Protocol</b>
    <p class="small"><b>Expected Pace:</b> Dropping from <b>78.0 kg → ~74.5–75.5 kg</b> over 4 weeks (0.5–0.8 kg/week) with zero strength loss on your 6-day lifting split.</p>
    <p class="small"><b>Day 14 Checkpoint:</b> Weigh yourself Mon/Wed/Fri mornings fasted. If your 7-day average hasn't dropped by at least 0.5 kg/week, reduce dry rice in evening batches from <b>90 g to 70 g</b> (~70 kcal/day cut) for Weeks 3–4.</p>
  </div>
  <h2>28-Day Log</h2>
  <div class="tablewrap"><table>
    <thead><tr><th>Date</th><th>Training</th><th>Weight</th><th>Water</th><th>Protein</th><th>Bloat (1–5)</th><th>Done</th></tr></thead>
    <tbody>${DATA.days.map(d => {
      const m = state.metrics[d.date] || {};
      const meal = Math.round(progressFor(d.date) * 100);
      return `<tr>
        <td>${escapeHtml(d.label)}</td>
        <td>${escapeHtml(d.training)}</td>
        <td>${m.weight ?? "—"}</td>
        <td>${m.water ? m.water + " L" : "—"}</td>
        <td>${m.protein ? m.protein + " g" : "—"}</td>
        <td>${m.bloat ?? "—"}</td>
        <td>${meal}%</td>
      </tr>`;
    }).join("")}</tbody>
  </table></div>`;
}

/* ------------------------------------------------------------------ *
 * 4. RENDER + BIND
 * ------------------------------------------------------------------ */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false"));

  const app = document.getElementById("app");
  if (state.tab === "today")          app.innerHTML = todayView();
  else if (state.tab === "calendar")  app.innerHTML = calendarView();
  else if (state.tab === "prep")      app.innerHTML = prepView();
  else if (state.tab === "budget")    app.innerHTML = budgetView();
  else                                app.innerHTML = progressView();

  bind();
  save();
}

function bind(){
  document.querySelectorAll("[data-tab]").forEach(x => { x.onclick = () => setTab(x.dataset.tab); });
  document.querySelectorAll("[data-go]").forEach(x => { x.onclick = () => setSelected(x.dataset.go); });

  document.querySelectorAll("[data-week]").forEach(x => {
    x.onclick = () => {
      const cur = byDate(state.selected) || DATA.days[0];
      const target = addDays(cur.date, Number(x.dataset.week) * 7);
      state.selected = nearestDay(target);
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    };
  });

  document.querySelectorAll("[data-check]").forEach(x => {
    x.onchange = e => setChecked(state.selected, x.dataset.check, e.target.checked);
  });

  document.querySelectorAll("[data-prep]").forEach(x => {
    x.onchange = e => { state.prep[x.dataset.prep] = e.target.checked; save(); render(); };
  });

  document.querySelectorAll("[data-metric]").forEach(x => {
    x.oninput = e => {
      state.metrics[state.selected] = state.metrics[state.selected] || {};
      state.metrics[state.selected][x.dataset.metric] = e.target.value;
      save();
    };
  });

  document.querySelectorAll("[data-budget]").forEach(x => {
    x.onchange = e => {
      state.budget = state.budget || {spent:0};
      state.budget[x.dataset.budget] = Number(e.target.value) || 0;
      save(); render();
    };
  });
}

render();
</script>
</body>
</html>
