<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Meal OS — 4-week recomp plan</title>
<style>
:root{
 --bg:#fff;--panel:#fff;--ink:#1c2025;--ink2:#59616a;--line:#e0e2df;--field:#f4f5f3;
 --green:#2b8f55;--blue:#2a5db8;--yellow:#e0ab12;--red:#c8362d;--purple:#6e4bb5;
 --warn-bg:#f7ebcb;--warn-ink:#5a3f00;--nav-h:62px;
 box-sizing:border-box;color-scheme:light
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:calc(var(--nav-h) + 26px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.top{padding:14px 0 6px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:850;font-size:23px;letter-spacing:-.02em}
.top .right{display:flex;align-items:center;gap:10px}
#sync{font-size:12px;color:var(--ink2)}
.home-btn{font-size:22px;text-decoration:none;color:var(--ink2);width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:0 0 auto;line-height:1}
.home-btn:hover,.home-btn:focus-visible{background:var(--field);color:var(--ink);outline:none}
@media(max-width:420px){#sync{display:none}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line)}
nav.tabs .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{height:var(--nav-h);border:0;background:transparent;font-weight:750;font-size:13px;color:var(--ink2);position:relative}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;left:25%;right:25%;top:0;height:4px;background:var(--ink)}
h1,h2,h3{margin:0;font-weight:850;letter-spacing:-.02em;line-height:1.08}
h1{font-size:clamp(38px,10vw,58px)}
h2{font-size:27px;margin:24px 0 10px}
h3{font-size:18px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.note{background:var(--warn-bg);color:var(--warn-ink);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.weekbar .ttl{font-weight:850;font-size:19px;text-align:center;flex:1}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:22px;background:#fff;font-weight:800}
.iconbtn:hover{background:var(--field)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 14px}
.daybtn{border:0;background:transparent;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:9px}
.daybtn.sel{background:var(--field)}
.daybtn:disabled{opacity:.35;cursor:default}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--line);transition:transform .12s ease,border-color .12s ease}
.daybtn:not(:disabled):hover .dot{border-color:var(--ink2)}
.daybtn.sel .dot{border-color:var(--ink);transform:scale(1.06)}
.daybtn.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.daybtn .lab{font-size:11px;color:var(--ink2);font-weight:700}
.hero{padding:22px 20px;border-radius:12px;background:var(--ink);color:#fff;margin-bottom:14px}
.hero .sub{margin:5px 0 12px;opacity:.88}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12px;font-weight:750;padding:4px 9px;border:1px solid currentColor;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);padding:12px;border-radius:10px;background:var(--panel);transition:border-color .12s ease}
.stat:hover{border-color:var(--ink2)}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--ink2);font-weight:700}
.meal{border-top:1px solid var(--line);padding:15px 0}
.mealhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mealtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 7px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);font-weight:800}
.mealmeta{text-align:right;white-space:nowrap;font-size:12px;color:var(--ink2);font-weight:750}
.meal ul{margin:8px 0 8px;padding-left:20px}
.checkrow{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0;min-height:32px}
.checkrow input{width:19px;height:19px;cursor:pointer}
.chklabel{font-size:13px;font-weight:750}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:42px;padding:0 14px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-weight:800}
.btn:hover{opacity:.9}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.green{background:var(--green);border-color:var(--green)}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:750}
.field input,.field textarea,.field select{width:100%;height:44px;border:1.5px solid var(--line);background:var(--field);border-radius:8px;padding:0 9px}
.field textarea{height:78px;padding:9px;resize:vertical}
.recipe{border-top:1px solid var(--line);padding:10px 0}
.recipe summary{cursor:pointer;font-weight:800;padding:4px 0}
.recipe .inside{padding-top:8px;font-size:14px}
.togl{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:750;cursor:pointer;padding:4px 0}
.togl input{width:18px;height:18px;cursor:pointer}
.calendar-week{border-top:1px solid var(--line);padding:16px 0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calday{border:1px solid var(--line);border-radius:9px;padding:8px;min-height:175px;transition:border-color .12s ease}
.calday:hover{border-color:var(--ink2)}
.calday.today{outline:2px solid var(--ink)}
.calday[data-go]{cursor:pointer}
.calday .date{font-weight:850;font-size:12px;margin-bottom:8px}
.calday .train{font-size:11px;color:var(--ink2);font-weight:750;margin-bottom:8px}
.calday .mini{font-size:11px;margin:5px 0}
.calday .mini b{display:block}
.prepitem{border-top:1px solid var(--line);padding:12px 0}
.prepitem .date{font-weight:850}
.prepitem ul{margin:7px 0;padding-left:20px}
.budgetbar{height:14px;background:var(--line);border-radius:8px;overflow:hidden}
.budgetbar i{display:block;height:100%;background:var(--green);width:0}
.progressbar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--blue);width:0}
.kpi{font-size:31px;font-weight:900}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:650px}
th,td{text-align:left;padding:8px 9px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--ink2)}
footer{padding:30px 0;color:var(--ink2);font-size:12px}
@media(max-width:700px){
 .fields{grid-template-columns:repeat(2,1fr)}
 .calendar-grid{grid-template-columns:1fr}
 .calday{min-height:auto}
 .hero{padding:18px 16px}
}
@media(min-width:760px){
 body{padding-bottom:40px;padding-top:70px}
 nav.tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
 nav.tabs .in{max-width:680px}
}
</style>
</head>

</div></nav>

/* ------------------------------------------------------------------ *
 * 2. DATE HELPERS  (timezone-safe: no toISOString on local dates)
 * ------------------------------------------------------------------ */
const parseDate = s => new Date(s + "T12:00:00");
const ymd = d => {
  const x = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return x.toISOString().slice(0, 10);
};
const addDays = (s, n) => { const x = parseDate(s); x.setDate(x.getDate() + n); return ymd(x); };
const monday = s => { const x = parseDate(s); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return ymd(x); };

const FIRST = DATA.days[0].date;
const LAST  = DATA.days[DATA.days.length - 1].date;

const byDate = d => DATA.days.find(x => x.date === d);
const fmt = d => parseDate(d).toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"short", year:"numeric"});
const shortDate = d => parseDate(d).toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"});
const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ------------------------------------------------------------------ *
 * 3. STATE
 * ------------------------------------------------------------------ */
const STORE_KEY = "mealos:oct2026:v1";
let state = {tab:"today", selected:DATA.start, done:{}, metrics:{}, prep:{}, budget:{spent:0}};

try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) { console.warn("Could not read saved state:", e); }

/* normalise whatever came back from storage */
state.done    = (state.done    && typeof state.done    === "object") ? state.done    : {};
state.metrics = (state.metrics && typeof state.metrics === "object") ? state.metrics : {};
state.prep    = (state.prep    && typeof state.prep    === "object") ? state.prep    : {};
state.budget  = (state.budget  && typeof state.budget  === "object") ? state.budget  : {spent:0};
if (!["today","calendar","prep","budget","progress"].includes(state.tab)) state.tab = "today";
if (!byDate(state.selected)) state.selected = DATA.start;

function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
  const el = document.getElementById("sync");
  if (el) el.textContent = "Saved on this device";
}

/* ------------------------------------------------------------------ *
 * 4. SMALL LOGIC HELPERS
 * ------------------------------------------------------------------ */
function setTab(t){
  state.tab = t;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function setSelected(d){
  if(!byDate(d)) return;
  state.selected = d;
  state.tab = "today";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

const checkKey = (d,k) => d + "|" + k;
const checked  = (d,k) => !!state.done[checkKey(d,k)];
function setChecked(d,k,v){ state.done[checkKey(d,k)] = v; save(); render(); }

/* nearest planned day (keeps week navigation inside the cycle) */
function nearestDay(d){
  if (byDate(d)) return d;
  let best = FIRST, bestDiff = Infinity;
  for (const day of DATA.days){
    const diff = Math.abs(parseDate(day.date) - parseDate(d));
    if (diff < bestDiff){ bestDiff = diff; best = day.date; }
  }
  return best;
}

function currentWeekDays(d){
  const m = monday(d);
  return Array.from({length:7}, (_,i) => addDays(m,i));
}

function dayTotals(day){
  const b  = DATA.breakfasts[day.breakfast];
  const l  = DATA.mains[day.lunch];
  const dn = DATA.mains[day.dinner];
  const s1 = DATA.snacks[day.snacks[0]];
  const s2 = DATA.snacks[day.snacks[1]];
  return {
    kcal: b.kcal + l.kcal + dn.kcal + s1.kcal + s2.kcal,
    p:    b.p    + l.p    + dn.p    + s1.p    + s2.p
  };
}

/* ALWAYS pass a date string here */
function progressFor(dateStr){
  const keys = ["bf","lunch","dinner","sn1","sn2","salad"];
  return keys.filter(k => checked(dateStr,k)).length / keys.length;
}

function weekLabel(d){
  const m = monday(d), su = addDays(m,6);
  const f = x => parseDate(x).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  return f(m) + " – " + f(su);
}

/* ------------------------------------------------------------------ *
 * 5. VIEWS
 * ------------------------------------------------------------------ */
function weekStrip(d){
  const ds = currentWeekDays(d);
  return `<div class="weekstrip">${ds.map(x => {
    const item = byDate(x);
    const cls = (x === state.selected ? " sel" : "") + (item && progressFor(x) === 1 ? " done" : "");
    const n = item ? String(item.cycleDay) : "";
    return `<button class="daybtn${cls}" data-go="${x}" ${item ? "" : "disabled"} aria-label="${escapeHtml(item ? 'Day ' + item.cycleDay : 'No plan')}">
      <span class="dot">${escapeHtml(n)}</span>
      <span class="lab">${parseDate(x).toLocaleDateString(undefined,{weekday:"short"})}</span>
    </button>`;
  }).join("")}</div>`;
}

function mealCard(day, key, title, obj, badge){
  const isDone = checked(day.date, key);
  const list   = obj.items || [];               // breakfasts + snacks
  const batch  = obj.ingredients || null;       // mains use "ingredients"
  return `<div class="meal">
    <div class="mealhead">
      <div class="mealtitle"><h3>${escapeHtml(title)}</h3><span class="badge">${escapeHtml(badge)}</span></div>
      <div class="mealmeta">${obj.kcal} kcal<br>${obj.p} g protein</div>
    </div>
    ${list.length ? `<ul>${list.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>` : ""}
    ${batch ? `<details class="recipe"><summary>Batch ingredients (3 portions)</summary>
        <div class="inside"><ul>${batch.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul></div>
      </details>` : ""}
    <label class="checkrow">
      <input type="checkbox" data-check="${key}" ${isDone ? "checked" : ""}>
      <span class="chklabel">${isDone ? "✓ Completed" : "Mark meal completed"}</span>
    </label>
  </div>`;
}

function prepView(){
  return `<h2>3-day cooking system</h2>
  <p class="muted">Cook two mains at each prep session: 3 portions of each. That gives you six portions across three days without repeating the exact same lunch and dinner every day.</p>
  <div class="note"><b>Storage:</b> cool prepared food promptly, portion it, refrigerate what you will eat within about 2–3 days, and freeze portions that will go beyond that window. Keep salad garnishes separate so they stay crisp.</div>
  ${DATA.prep.map(p => {
    const done = !!state.prep[p.date];
    return `<div class="prepitem">
      <div class="date">${escapeHtml(p.date)} · ${escapeHtml(p.title)}</div>
      <div class="muted small">${done ? "✓ Completed" : "Not completed yet"}</div>
      <ul>${p.tasks.map(t => `<li>${escapeHtml(t)}</li>`).join("")}</ul>
      <label class="togl"><input type="checkbox" data-prep="${p.date}" ${done ? "checked" : ""}> Mark prep complete</label>
      <div style="margin-top:8px">${p.recipes.map(r => `
        <details class="recipe">
          <summary>${r} — ${escapeHtml(DATA.mains[r].name)}</summary>
          <div class="inside"><b>3-portion batch ingredients:</b>
            <ul>${DATA.mains[r].ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>
            <b>Batch macro target:</b> ~${DATA.mains[r].kcal} kcal / ${DATA.mains[r].p} g protein per portion.
          </div>
        </details>`).join("")}</div>
    </div>`;
  }).join("")}
  <h2>Breakfast prep</h2>
  <div class="card"><p class="small"><b>Good 3-day pattern:</b> prepare 3 overnight-oat/quark jars, 6 boiled or baked eggs, chopped vegetables and measured oats/snack bags. Do not pre-slice bananas or assemble wet wraps.</p></div>
  <h2>Salad system</h2>
  <div class="card">${Object.entries(DATA.salads).map(([k,v]) => `
    <div class="recipe"><details><summary>${k} — ${escapeHtml(v.name)}</summary>
      <div class="inside"><ul>${v.items.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul></div>
    </details></div>`).join("")}</div>`;
}

function budgetView(){
  const m = state.budget || {spent:0};
  const planned = DATA.budget.monthlyCap;
  const spent = Number(m.spent) || 0;
  const pct = Math.min(100, Math.round(spent / planned * 100));
  return `<h2>€180 monthly budget</h2>
  <div class="stats">
    <div class="stat"><b>€${planned}</b><span>hard ceiling</span></div>
    <div class="stat"><b>€${DATA.budget.foodTarget}</b><span>food target</span></div>
    <div class="stat"><b>€${DATA.budget.supplementsBuffer}</b><span>supplement buffer</span></div>
    <div class="stat"><b>€${Math.max(0, planned - spent).toFixed(2)}</b><span>remaining</span></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><b>Actual spend this month</b><span class="kpi">€${spent.toFixed(2)}</span></div>
    <div class="budgetbar" style="margin:10px 0"><i style="width:${pct}%"></i></div>
    <div class="muted small">Target: keep groceries around €155 and leave the remainder for creatine/D3/price variation. Do not treat the supplement buffer as a requirement to spend it.</div>
    <div class="fields" style="margin-top:12px">
      <label class="field">Total spent<input type="number" step="0.01" inputmode="decimal" data-budget="spent" value="${m.spent ?? 0}"></label>
    </div>
  </div>
  <h2>Price rules</h2>
  <div class="card">${Object.entries(DATA.budget.priceTargets).map(([k,v]) =>
    `<p><b>${escapeHtml(k)}</b><br><span class="muted small">${escapeHtml(v)}</span></p>`).join("")}</div>
  <h2>Weekly shopping lists</h2>
  ${Object.entries(DATA.shopping).map(([w,items]) => `
    <details class="card" open><summary><b>${escapeHtml(w)}</b></summary>
      <ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>
    </details>`).join("")}
  <div class="note"><b>Budget strategy:</b> Aldi/Lidl first for staple dairy, eggs, oats, rice and frozen vegetables; Kaufland for larger pulse/spice packs and promotions; Edeka mainly when a specific item is on sale. Standard wraps beat premium “protein” wraps when the filling already supplies protein.</div>`;
}

function progressView(){
  const vals = DATA.days
    .map(d => (state.metrics[d.date] || {}).weight)
    .filter(v => v !== undefined && v !== null && v !== "")
    .map(Number)
    .filter(v => !isNaN(v));
  const avg = vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
  const KEYS = ["bf","lunch","dinner","sn1","sn2","salad"];
  const allMeals = DATA.days.length * KEYS.length;
  const doneMeals = DATA.days.reduce((n,d) => n + KEYS.filter(k => checked(d.date,k)).length, 0);
  const mealPct = Math.round(doneMeals / allMeals * 100);
  return `<h2>Progress</h2>
  <div class="stats">
    <div class="stat"><b>${mealPct}%</b><span>meal adherence</span></div>
    <div class="stat"><b>${avg ? avg.toFixed(1) : "—"}</b><span>avg weight kg</span></div>
    <div class="stat"><b>${vals.length}</b><span>weight entries</span></div>
    <div class="stat"><b>${Object.values(state.prep).filter(Boolean).length}</b><span>preps completed</span></div>
  </div>
  <div class="card"><b>Month-1 success criteria</b>
    <p class="small">Weight broadly stable, waist trending down slowly, training performance improving, hunger manageable, and meals/prep consistent. Do not judge the plan from a single weigh-in.</p></div>
  <h2>Daily log</h2>
  <div class="tablewrap"><table>
    <thead><tr><th>Date</th><th>Training</th><th>Weight</th><th>Protein</th><th>Hunger</th><th>Meals</th></tr></thead>
    <tbody>${DATA.days.map(d => {
      const m = state.metrics[d.date] || {};
      const meal = Math.round(progressFor(d.date) * 100);
      return `<tr>
        <td>${escapeHtml(d.label)}</td>
        <td>${escapeHtml(d.training)}</td>
        <td>${m.weight ?? "—"}</td>
        <td>${m.protein ?? "—"}</td>
        <td>${m.hunger ?? "—"}</td>
        <td>${meal}%</td>
      </tr>`;
    }).join("")}</tbody>
  </table></div>
  <h2>Adjustment rules</h2>
  <div class="card">
    <p class="small"><b>Keep calories:</b> weight is roughly stable, waist is slowly decreasing, gym performance improves and hunger is manageable.</p>
    <p class="small"><b>Add ~100–150 kcal:</b> weight is dropping quickly, hunger is consistently high or training performance is worsening.</p>
    <p class="small"><b>Remove ~100–150 kcal:</b> average weight and waist are both rising for about 2 weeks.</p>
  </div>`;
}

/* ------------------------------------------------------------------ *
 * 6. RENDER + BIND
 * ------------------------------------------------------------------ */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false"));

  const app = document.getElementById("app");
  if (state.tab === "today")          app.innerHTML = todayView();
  else if (state.tab === "calendar")  app.innerHTML = calendarView();
  else if (state.tab === "prep")      app.innerHTML = prepView();
  else if (state.tab === "budget")    app.innerHTML = budgetView();
  else                                app.innerHTML = progressView();

  bind();
  save();
}

function bind(){
  document.querySelectorAll("[data-tab]").forEach(x => { x.onclick = () => setTab(x.dataset.tab); });

  document.querySelectorAll("[data-go]").forEach(x => { x.onclick = () => setSelected(x.dataset.go); });

  document.querySelectorAll("[data-week]").forEach(x => {
    x.onclick = () => {
      const cur = byDate(state.selected) || DATA.days[0];
      const target = addDays(cur.date, Number(x.dataset.week) * 7);
      state.selected = nearestDay(target);
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    };
  });

  document.querySelectorAll("[data-check]").forEach(x => {
    x.onchange = e => setChecked(state.selected, x.dataset.check, e.target.checked);
  });

  document.querySelectorAll("[data-prep]").forEach(x => {
    x.onchange = e => { state.prep[x.dataset.prep] = e.target.checked; save(); render(); };
  });

  /* metrics: save as you type so nothing is lost on re-render */
  document.querySelectorAll("[data-metric]").forEach(x => {
    x.oninput = e => {
      state.metrics[state.selected] = state.metrics[state.selected] || {};
      state.metrics[state.selected][x.dataset.metric] = e.target.value;
      save();
    };
  });

  document.querySelectorAll("[data-budget]").forEach(x => {
    x.onchange = e => {
      state.budget = state.budget || {spent:0};
      state.budget[x.dataset.budget] = Number(e.target.value) || 0;
      save(); render();
    };
  });
}

render();
</script>
</body>
</html>
