<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Gym log - 12-week plan made for Abhishek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --ink:#1C2025; --ink2:#59616A; --line:#E0E2DF; --field:#F4F5F3;
  --red:#C8362D; --blue:#2A5DB8; --yellow:#E0AB12; --green:#2B8F55; --white:#F6F6F3; --black:#272B30; --chrome:#9AA1A8;
  --on-red:#FFFFFF; --on-blue:#FFFFFF; --on-yellow:#1C2025; --on-green:#FFFFFF; --on-white:#1C2025; --on-black:#FFFFFF; --on-chrome:#1C2025;
  --ring-white:#858C94; --ring-black:#272B30;
  --warn-bg:#F7EBCB; --warn-ink:#5A3F00;
  --nav-h:62px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 "Archivo","Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(var(--nav-h) + 28px);
}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink2)}
.small{font-size:13px}
h1,h2,h3{margin:0;font-stretch:75%;font-weight:800;letter-spacing:-.01em;line-height:1.05}
h2{font-size:26px;margin:28px 0 10px}
h3{font-size:19px}

/* plate colour scopes */
.p-red{--pb:var(--red);--pf:var(--on-red);--pr:var(--red)}
.p-blue{--pb:var(--blue);--pf:var(--on-blue);--pr:var(--blue)}
.p-yellow{--pb:var(--yellow);--pf:var(--on-yellow);--pr:var(--yellow)}
.p-green{--pb:var(--green);--pf:var(--on-green);--pr:var(--green)}
.p-white{--pb:var(--white);--pf:var(--on-white);--pr:var(--ring-white)}
.p-black{--pb:var(--black);--pf:var(--on-black);--pr:var(--ring-black)}
.p-chrome{--pb:var(--chrome);--pf:var(--on-chrome);--pr:var(--chrome)}

/* top bar */
.top{padding:14px 0 6px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-stretch:75%;font-weight:800;font-size:22px;letter-spacing:-.01em}
.tag{display:block;font-stretch:75%;font-weight:700;font-size:13px;color:var(--red);letter-spacing:.01em;margin-top:2px}
.header-right{display:flex;align-items:center;gap:10px}
#sync{font-size:12px;color:var(--ink2)}
.home-btn{font-size:22px;text-decoration:none;color:var(--ink2);width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:0 0 auto;line-height:1}
.home-btn:hover,.home-btn:focus-visible{background:var(--field);color:var(--ink);outline:none}
@media(max-width:420px){#sync{display:none}}

/* nav */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{
  height:var(--nav-h);border:0;background:transparent;font-stretch:75%;font-weight:700;font-size:18px;color:var(--ink2);
  position:relative;
}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;left:28%;right:28%;top:0;height:4px;background:var(--ink)}
@media (min-width:760px){
  body{padding-bottom:40px;padding-top:var(--nav-h)}
  nav.tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  nav.tabs .in{max-width:420px;margin:0 auto}
  nav.tabs button{height:var(--nav-h)}
  nav.tabs button[aria-current="page"]::after{top:auto;bottom:0}
}

/* week strip */
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.weekbar .ttl{font-stretch:75%;font-weight:800;font-size:20px;flex:1;text-align:center;line-height:1.1;padding:0 8px}
.iconbtn{min-width:44px;height:44px;border:1px solid var(--line);border-radius:22px;background:var(--panel);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:6px 0 4px}
.strip .disc{width:100%;max-width:44px;height:auto;aspect-ratio:1/1}
.dayb{border:0;background:transparent;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:10px}
.dayb .lab{font-size:12px;color:var(--ink2);font-weight:600}
.dayb[aria-current="date"] .lab{color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.disc{
  --p:0;
  width:44px;height:44px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--pr) 0 calc(var(--p) * 1%), var(--pr-soft, rgba(128,134,140,.35)) 0);
  font-weight:800;font-size:15px;
}
@supports (color: color-mix(in srgb, red 50%, blue)){
  .disc,.mini{--pr-soft:color-mix(in srgb, var(--pr) 32%, transparent)}
}
.disc::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.disc span{position:relative}
.disc.done{background:var(--pb);box-shadow:inset 0 0 0 2px var(--pr)}
.disc.done::before{background:var(--pb)}
.disc.done span{color:var(--pf)}
.disc.miss span{color:var(--ink2);text-decoration:line-through}
.disc.off{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.disc.off::before{display:none}
.disc.off span{color:var(--ink2)}
.dayb.today .disc{outline:2px solid var(--ink);outline-offset:3px}

/* session slab */
.slab{background:var(--pb);color:var(--pf);padding:20px 18px 18px;margin:12px 0 0;border-radius:6px}
.slab h1{font-size:clamp(46px,13vw,72px)}
.slab .sub{font-size:16px;margin:4px 0 12px;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border:1.5px solid currentColor;border-radius:999px}
.p-white .slab,.slab.p-white{box-shadow:inset 0 0 0 2px var(--ring-white)}

.note-box{background:var(--warn-bg);color:var(--warn-ink);padding:10px 12px;border-radius:6px;margin:10px 0;font-size:14px}
.setup{border:2px dashed var(--ink2);padding:12px;border-radius:8px;margin:14px 0}
.setup .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}

/* buttons */
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.plate{background:var(--pb);color:var(--pf);border-color:var(--pr)}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;min-height:32px}

/* progress line */
.dayprog{display:flex;align-items:center;gap:12px;margin:14px 0 4px;font-size:14px;color:var(--ink2)}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pb,var(--ink));width:0}

/* detail blocks */
details.blk{border-top:1px solid var(--line);padding:2px 0}
details.blk>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:700}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::after{content:"+";font-size:22px;color:var(--ink2)}
details.blk[open]>summary::after{content:"–"}
details.blk .inner{padding:0 0 12px;color:var(--ink);font-size:15px}
details.blk ul,details.blk ol{margin:6px 0;padding-left:20px}

/* exercise */
.exlist{margin:14px 0 0}
.ex{border-top:1px solid var(--line);padding:16px 0 8px}
.ex h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex .var{font-size:12px;font-weight:700;border:1.5px solid var(--ink2);color:var(--ink2);border-radius:999px;padding:0 8px;font-stretch:100%}
.ex .tgt{margin:2px 0 0;font-weight:600;font-size:14px}
.ex .note{margin:2px 0 0;font-size:14px;color:var(--ink2)}
.ex .last{margin:8px 0 0;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ex .hint{margin:6px 0 0;font-size:14px;font-weight:600;color:var(--ink)}
.ex .hint::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pb);box-shadow:inset 0 0 0 2px var(--pr);margin-right:8px}
.grp{font-stretch:75%;font-weight:800;font-size:22px;margin:26px 0 0}
ol.sets{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 12px minmax(0,1fr) 46px;gap:6px;align-items:center}
.set .n{font-weight:700;color:var(--ink2);text-align:center}
.set .x{color:var(--ink2);text-align:center}
.inp{position:relative}
.inp input{width:100%;height:46px;border:1.5px solid var(--line);background:var(--field);border-radius:8px;padding:0 8px 0 10px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.inp input::placeholder{color:var(--ink2);opacity:.55;font-weight:500}
.inp small{position:absolute;right:8px;top:2px;font-size:10px;color:var(--ink2);pointer-events:none;background:var(--field);padding-left:2px}
.inp.none input{visibility:hidden}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink2);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.35}
.chk[aria-pressed="true"]{background:var(--pb);color:var(--pf);border-color:var(--pr)}
.chk[aria-pressed="true"] svg{opacity:1}
.set.on input{border-color:var(--pr)}
.addset{margin:8px 0 6px}

/* cardio + metrics */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2);font-weight:600}
.fld input,.fld select,textarea{width:100%;height:46px;border:1.5px solid var(--line);background:var(--field);border-radius:8px;padding:0 10px;font-size:17px;font-weight:600;color:var(--ink)}
textarea{height:auto;min-height:84px;padding:10px;font-weight:400;font-size:16px;resize:vertical}
.togs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.tog{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ink2);background:transparent;font-weight:600}
.tog[aria-pressed="true"]{background:var(--pb);color:var(--pf);border-color:var(--pr)}

/* photo */
.photo-label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}

/* plan */
.seg{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px}
.seg button{min-height:40px;padding:0 14px;border:1.5px solid var(--line);background:transparent;border-radius:999px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dayrow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dayrow .disc{--p:100}
.dayrow .disc::before{background:var(--pb)}
.dayrow .disc span{color:var(--pf)}
.dayrow strong{font-stretch:75%;font-size:20px;font-weight:800}
.dayrow .s{display:block;font-size:14px;color:var(--ink2)}
.scroll-x{overflow-x:auto;margin:8px -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{text-align:left;padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--ink2);font-size:13px;border-top:0}
tr.now td{background:color-mix(in srgb, var(--yellow) 22%, transparent);font-weight:700}
ul.tight,ol.tight{margin:6px 0 10px;padding-left:20px}
ul.tight li,ol.tight li{margin:4px 0}
.exrow{padding:9px 0;border-top:1px solid var(--line)}
.exrow b{font-weight:700}
.exrow .m{display:block;font-size:13px;color:var(--ink2)}
.tier{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;border:1.5px solid var(--ink2);color:var(--ink2);padding:0 8px;margin-left:6px}

/* progress */
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0}
.stat div{min-width:0}
.stat b{display:block;font-stretch:75%;font-weight:800;font-size:clamp(26px,8vw,38px);line-height:1;margin-bottom:2px}
.grid12{display:grid;gap:6px;margin:10px 0}
.grid12 .r{display:grid;grid-template-columns:44px repeat(6,minmax(0,1fr));gap:6px;align-items:center;padding:3px 6px;border-radius:10px}
.grid12 .r.sel{background:var(--field);box-shadow:inset 0 0 0 1.5px var(--ink2)}
.grid12 .wk{background:none;border:0;padding:0;min-height:28px;text-align:left;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.grid12 .r.sel .wk{color:var(--ink)}
.mini{--p:0;width:20px;height:20px;border-radius:50%;justify-self:center;background:var(--pr-soft, rgba(128,134,140,.35))}
.mini.done{background:var(--pb);box-shadow:inset 0 0 0 2px var(--pr)}
.mini.part{background:conic-gradient(var(--pr) 0 calc(var(--p) * 1%), var(--pr-soft, rgba(128,134,140,.35)) 0)}
.mini.future{opacity:.35}
.mini.miss{background:transparent;box-shadow:inset 0 0 0 2px var(--pr);position:relative}
.mini.miss::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;margin-top:-1px;background:var(--pr);transform:rotate(-45deg)}
.chart{width:100%;height:auto;display:block;margin:6px 0}
.chart path{stroke:var(--ink);fill:none;stroke-width:2;stroke-linejoin:round}
.chart circle{fill:var(--ink)}
.chart text{fill:var(--ink2);font-size:10px;font-family:inherit}
.chart line{stroke:var(--line);stroke-width:1}
select.sel{height:46px;width:100%;border:1.5px solid var(--line);background:var(--field);border-radius:8px;padding:0 10px;font-weight:600}
.logrow{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;min-height:48px}
.logrow .a{font-weight:700}
.logrow .b{color:var(--ink2);font-size:14px;white-space:nowrap}
.tbl{width:100%;font-size:14px;min-width:0}
.tbl td{padding:6px 8px 6px 0}

/* rest timer */
.rest{
  position:fixed;left:0;right:0;z-index:30;background:var(--ink);color:var(--bg);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  transform:translateY(0);transition:transform .18s ease-out;
}
.rest[hidden]{display:block;transform:translateY(160%);pointer-events:none;visibility:hidden;transition:transform .18s ease-out,visibility 0s linear .18s}
.rest .in{max-width:720px;margin:0 auto;padding:10px 16px 12px}
.rest .track{height:5px;background:rgba(128,134,140,.5);border-radius:3px;overflow:hidden}
.rest .track i{display:block;height:100%;background:var(--bg);width:100%}
.rest .row{display:flex;align-items:center;gap:6px;margin-top:8px}
.rest strong{font-stretch:75%;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;min-width:66px}
.rest .lbl{flex:1;min-width:0;font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest button{min-height:42px;min-width:46px;padding:0 10px;border-radius:8px;border:1.5px solid var(--bg);background:transparent;color:var(--bg);font-weight:700;font-size:15px}
.rest .row button:first-of-type{margin-left:auto}
@media (max-width:519px){.rest .lbl{display:none}}
@media (min-width:760px){.rest{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}}
@media (prefers-reduced-motion:reduce){.rest{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div>
    <span class="brand">Gym log</span>
    <span class="tag">U got it BITCH!! hit the gym, lift the weights</span>
  </div>
  <div class="header-right">
    <span id="sync"></span>
    <a href="index.html" class="home-btn" aria-label="Back to home">⌂</a>
  </div>
</div></header>
<main id="app" class="wrap" aria-live="polite"></main>

<div id="rest" class="rest" hidden>
  <div class="in">
    <div class="track"><i id="restfill"></i></div>
    <div class="row">
      <strong id="resttime">0:00</strong>
      <span class="lbl" id="restlabel"></span>
      <button type="button" data-rest="-15" aria-label="Subtract 15 seconds">−15</button>
      <button type="button" data-rest="15" aria-label="Add 15 seconds">+15</button>
      <button type="button" data-rest="skip">Skip</button>
      <button type="button" data-rest="mute" id="restmute" aria-label="Turn sound on or off">🔊</button>
    </div>
  </div>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button type="button" data-tab="today">Today</button>
  <button type="button" data-tab="plan">Plan</button>
  <button type="button" data-tab="progress">Progress</button>
</div></nav>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var pad=function(n){return String(n).padStart(2,'0')};
var ds=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var pd=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var addDays=function(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
var dowOf=function(s){return (pd(s).getDay()+6)%7};
var mondayOf=function(s){return addDays(s,-dowOf(s))};
var diffDays=function(a,b){return Math.round((pd(a)-pd(b))/86400000)};
var todayStr=function(){return ds(new Date())};
var fmtLong=function(s){return pd(s).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})};
var fmtShort=function(s){return pd(s).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var fnum=function(n){return n==null?'':(Number.isInteger(n)?String(n):String(+n.toFixed(2)))};
var $=function(s,el){return (el||document).querySelector(s)};

/* ---------- plan data ---------- */
var REST={main:{label:'2–3 min',s:150},comp:{label:'90 s – 2 min',s:105},iso:{label:'60 s',s:60}};
var U={
  kg:{a:'kg',b:'reps'}, db:{a:'kg each',b:'reps'}, bw:{a:null,b:'reps'}, sec:{a:null,b:'sec'},
  pull:{a:'+kg',b:'reps'}, dbleg:{a:'kg each',b:'reps/leg'}, carry:{a:'kg each',b:'m'}
};
var E=function(o){return Object.assign({tier:'iso',u:'kg',grp:'lift'},o)};
var V=function(id,name,u){return {id:id,name:name,u:u}};

var DAYS=[
{k:'mon',long:'Monday',s:'Mon',init:'M',t:'Push',sub:'Chest, shoulders, triceps',plate:'red',train:true,
 mob:'Band pull-aparts 2×20 · arm circles · scapular push-ups 2×12',
 stretch:['Doorway chest stretch','Overhead triceps stretch','Cross-body shoulder stretch',"Child's pose"],
 ex:[
  E({id:'bench',name:'Barbell bench press',tier:'main',sets:[3,4,4],reps:['8–10','6–8','4–6'],inc:2.5,note:'Set the safety arms or use a spotter. Shoulder blades pinned back and down.'}),
  E({id:'sdp',name:'Seated DB shoulder press',tier:'main',sets:3,reps:'8–12',u:'db',inc:2,note:"Back supported, don't arch."}),
  E({id:'incdb',name:'Incline DB press',tier:'comp',sets:3,reps:'8–12',u:'db',inc:2,note:'Bench at about 30°. Slow 3-second lowering.'}),
  E({slot:'Lateral raise',alt:{A:V('lat_cable_m','Cable lateral raise'),B:V('lat_db_m','Dumbbell lateral raise','db')},sets:3,reps:'12–20',inc:1,note:'Lead with the elbow. Go lighter than your ego wants.'}),
  E({slot:'Triceps pushdown',alt:{A:V('pd_rope_m','Rope triceps pushdown'),B:V('pd_bar_m','Straight-bar triceps pushdown')},sets:3,reps:'10–15',inc:2.5,note:'Elbows pinned to your sides.'}),

  el.textContent = store.mode==='local' ? 'Saved on this device only' : store.mode==='db' ? (s==='error'?'Save failed, retrying':s==='saving'?'Saving…':'Saved to your account') : '';

  store.ver[date]=(store.ver[date]||0)+1;

  if(store.mode==='local'){clearTimeout(store.lt);store.lt=setTimeout(saveLocal,250);return}
  if(store.mode!=='db') return;
  clearTimeout(store.timers[date]);
  store.timers[date]=setTimeout(function(){flush(date)},600);
  setSync('saving');
}
function flush(date){
  if(store.saving[date]){store.timers[date]=setTimeout(function(){flush(date)},400);return}
  var doc=state.logs[date]; if(!doc) return;
  var v=store.ver[date]; store.saving[date]=true;
  store.profile.collection('logs').doc(date).set(clone(doc)).then(function(){
    if(store.ver[date]===v) store.pending.delete(date);
    setSync('ok');
  }).catch(function(){
    setSync('error'); store.timers[date]=setTimeout(function(){flush(date)},4000);
  }).then(function(){store.saving[date]=false});
}

  if(store.mode==='local'){saveLocal();return}
  if(store.mode==='db'){store.profile.set({start:state.start}).then(function(){setSync('ok')}).catch(function(){setSync('error')})}
}
function softRender(){
  var a=document.activeElement;
  if(a && $('#app').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){store.dirtyRender=true;return}
  render();
}
function markLoaded(k){store.loaded[k]=true; if(store.loaded.profile&&store.loaded.logs&&!store.ready){store.ready=true;render()}}

function initStorage(){
  var claude=window.claude;
  var go=function(db,user){
    if(!db||!user) return Promise.resolve(null);
    return user.id().then(function(uid){ return uid?{db:db,uid:uid}:null }).catch(function(){return null});
  };
  var p;
  try{
    p = (claude && typeof claude.use==='function')
      ? Promise.all([claude.use('db'),claude.use('user')]).then(function(r){return go(r[0],r[1])}).catch(function(){return null})
      : Promise.resolve(null);
  }catch(e){p=Promise.resolve(null)}
  p.then(function(r){
    if(!r){ store.mode='local'; loadLocal(); store.ready=true; setSync(); render(); return }
    store.mode='db';
    store.profile=r.db.doc('data/users/'+r.uid+'/profile');
    setSync('ok');
    store.profile.onSnapshot(function(snap){
      if(snap.metadata&&snap.metadata.hasPendingWrites) return;
      var d=snap.exists?snap.data():null;
      if(d&&d.start&&d.start!==state.start){state.start=d.start;markLoaded('profile');softRender();return}
      markLoaded('profile');
    },function(){markLoaded('profile');setSync('error')});
    store.profile.collection('logs').onSnapshot(function(snap){
      if(snap.metadata&&snap.metadata.hasPendingWrites) return;
      var changed=false;
      snap.docs.forEach(function(doc){
        var id=doc.id; if(store.pending.has(id)) return;
        var data=doc.data();
        if(JSON.stringify(state.logs[id])!==JSON.stringify(data)){state.logs[id]=clone(data);changed=true}
      });
      var first=!store.loaded.logs;
      markLoaded('logs');
      if(changed&&!first) softRender();
    },function(){markLoaded('logs');setSync('error')});
    setTimeout(function(){ if(!store.ready){store.loaded.profile=store.loaded.logs=true;store.ready=true;render()} },8000);
  });
}

/* ---------- plan logic ---------- */
function resolveEx(e,wk){
  var ph = wk<=4?0:wk<=8?1:2, isA=wk%2===1;
  var v=e.alt?e.alt[isA?'A':'B']:null;
  var sets=Array.isArray(e.sets)?e.sets[ph]:e.sets;
  var reps=Array.isArray(e.reps)?e.reps[ph]:e.reps;
  if([4,8,12].indexOf(wk)>-1) sets=Math.max(2,Math.ceil(sets*0.6));
  if(wk===1&&e.leg) sets=Math.max(2,sets-1);
  return Object.assign({},e,{id:v?v.id:e.id,name:v?v.name:e.name,u:(v&&v.u)||e.u,sets:sets,reps:reps,variant:v?(isA?'A':'B'):null});
}
function planFor(date){
  var startMon=mondayOf(state.start||todayStr());
  var wkRaw=Math.floor(diffDays(mondayOf(date),startMon)/7)+1;
  var wk=Math.min(12,Math.max(1,wkRaw));
  var day=DAYS[dowOf(date)];
  var exs=(day.ex||[]).filter(function(e){return !e.fromWeek||wk>=e.fromWeek}).map(function(e){return resolveEx(e,wk)});
  return {date:date,wkRaw:wkRaw,wk:wk,day:day,exs:exs,phase:wk<=4?1:wk<=8?2:3,deload:[4,8,12].indexOf(wk)>-1,ab:wk%2?'A':'B',startMon:startMon};
}
function cardioDone(p,log){
  var c=(log&&log.cardio)||{};
  if(p.day.cardio==='run') return (c.min||0)>0;
  if(p.day.cardio==='intervals') return (c.rounds||0)>0;
  return false;
}
function dayProgress(date){
  var p=planFor(date), log=state.logs[date]||{};
  if(!p.day.train) return {rest:true,done:0,total:0,pct:0,complete:false};
  var total=0,done=0;
  p.exs.forEach(function(e){
    if(e.optional) return;
    total+=e.sets;
    var arr=(log.ex||{})[e.id]||[];
    done+=Math.min(e.sets,arr.filter(function(s){return s&&s.d}).length);
  });
  if(p.day.cardio){total+=1; if(cardioDone(p,log)) done+=1}
  return {rest:false,done:done,total:total,pct:total?Math.round(done/total*100):0,complete:!!log.finished||(total>0&&done>=total)};
}
function lastFor(id,date){
  var dates=Object.keys(state.logs).filter(function(d){return d<date}).sort().reverse();
  for(var i=0;i<dates.length;i++){
    var s=((state.logs[dates[i]].ex)||{})[id];
    if(s){var done=s.filter(function(x){return x&&x.d});if(done.length) return {date:dates[i],sets:done}}
  }
  return null;
}
function topOf(reps){var n=String(reps).match(/\d+/g);return n?Math.max.apply(null,n.map(Number)):null}
function hintFor(e,last){
  if(!last||!e.inc||!(U[e.u]||U.kg).a) return '';
  var top=topOf(e.reps); if(!top) return '';
  var all=last.sets.every(function(s){return s.r!=null&&s.r>=top});
  if(!all||last.sets.length<Math.min(e.sets,3)) return '';
  var mx=Math.max.apply(null,last.sets.map(function(s){return s.w||0}));
  var next=fnum(mx+e.inc), tail;
  if(e.u==='pull') tail='Try adding '+next+' kg.';
  else if(e.u==='db'||e.u==='dbleg'||e.u==='carry') tail='Try '+next+' kg each.';
  else tail='Try '+next+' kg.';
  return 'You hit the top of the range on every set last time. '+tail;
}
function suggestSet(date,id,i){
  var arr=((state.logs[date]||{}).ex||{})[id]||[];
  for(var k=i-1;k>=0;k--){var s=arr[k];if(s&&(s.w!=null||s.r!=null)) return {w:s.w,r:s.r}}
  var last=lastFor(id,date);
  if(last){var s2=last.sets[i]||last.sets[last.sets.length-1];return {w:s2.w,r:s2.r}}
  return {w:null,r:null};
}

function repsText(e){

}

/* progress */
function score(e,s){ if(s.w>0&&s.r>0) return {v:s.w*(1+Math.min(s.r,12)/30),kind:'kg'}; return {v:s.r||0,kind:'reps'} }
function lineChart(pts,unit){
  if(pts.length<2) return '<p class="muted small">Log this on two different days to see a trend.</p>';
  var W=320,H=150,pl=34,pr=10,pt=10,pb=24;
  var ys=pts.map(function(p){return p.y}), lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys);
  if(lo===hi){lo-=1;hi+=1}
  var pad=(hi-lo)*.18; lo-=pad; hi+=pad;
  var t0=pd(pts[0].x).getTime(), t1=pd(pts[pts.length-1].x).getTime();
  var X=function(d){return pl+((pd(d).getTime()-t0)/((t1-t0)||1))*(W-pl-pr)};
  var Y=function(v){return pt+(1-(v-lo)/(hi-lo))*(H-pt-pb)};
  var path=pts.map(function(p,i){return (i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)}).join(' ');
  var dots=pts.map(function(p){return '<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3"/>'}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Trend from '+fnum(pts[0].y)+' to '+fnum(pts[pts.length-1].y)+' '+esc(unit)+'">'
   +'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(hi-pad).toFixed(1)+'" y2="'+Y(hi-pad).toFixed(1)+'"/><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(lo+pad).toFixed(1)+'" y2="'+Y(lo+pad).toFixed(1)+'"/>'
   +'<text x="'+(pl-4)+'" y="'+(Y(hi-pad)+3).toFixed(1)+'" text-anchor="end">'+fnum(+(hi-pad).toFixed(1))+'</text><text x="'+(pl-4)+'" y="'+(Y(lo+pad)+3).toFixed(1)+'" text-anchor="end">'+fnum(+(lo+pad).toFixed(1))+'</text>'
   +'<text x="'+pl+'" y="'+(H-6)+'">'+esc(fmtShort(pts[0].x))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(fmtShort(pts[pts.length-1].x))+'</text>'
   +'<path d="'+path+'"/>'+dots+'</svg>';
}
function progressView(){
  if(!store.ready) return '<p class="muted" style="margin-top:24px">Loading your log…</p>';
  var tl=tally(), t=tl.t, startMon=tl.startMon, out='';
  var viewMon=mondayOf(ui.date), curMon=mondayOf(t);
  var wkNum=Math.floor(diffDays(viewMon,startMon)/7)+1, inPlan=wkNum>=1&&wkNum<=12;
  var wkDone=0; for(var k=0;k<6;k++){ if(dayProgress(addDays(viewMon,k)).complete) wkDone++ }
  var grid='';
  for(var w=0;w<12;w++){
    var sel=addDays(startMon,w*7)===viewMon;
    var row='<div class="r'+(sel?' sel':'')+'"><button type="button" class="wk" data-act="pick-week" data-n="'+(w+1)+'" aria-label="Show week '+(w+1)+'">W'+(w+1)+([3,7,11].indexOf(w)>-1?' D':'')+'</button>';

      var cls='mini p-'+DAYS[i].plate+(pr.complete?' done':isMiss?' miss':(pr.pct>0?' part':''))+(d>tl.through?' future':'');
      row+='<span class="'+cls+'" style="--p:'+pr.pct+'" title="'+esc(fmtShort(d)+' · '+DAYS[i].t+' · '+status)+'"></span>';
    }

  }
  var pct=tl.sched?Math.round(tl.done/tl.sched*100)+'%':'–';
  out+='<h2 style="margin-top:20px">Consistency</h2><div class="stat"><div><b>'+tl.done+'</b><span class="muted small">sessions done</span></div><div><b>'+tl.missed+'</b><span class="muted small">sessions missed</span></div><div><b>'+pct+'</b><span class="muted small">aim for 80%+</span></div></div>';
  out+='<p class="muted small" style="margin:6px 0 0">Counted through '+esc(fmtLong(tl.through))+(tl.ahead?' (you marked '+tl.ahead+' day'+(tl.ahead===1?'':'s')+' done ahead of today)':'')+'. A day is done when every set is ticked or you tap Mark session done. Earlier days left undone count as missed. Sunday never counts.</p>';
  var wkTitle=inPlan?('Week '+wkNum+(viewMon===curMon?' (this week)':'')+' · '+wkDone+' of 6 done'):('Week of '+fmtShort(viewMon)+' · outside the 12 weeks');
  out+='<div class="weekbar" style="margin:18px 0 4px"><button type="button" class="iconbtn" data-act="week" data-n="-1" aria-label="Previous week">‹</button><span class="ttl" style="font-size:18px">'+esc(wkTitle)+'</span><button type="button" class="iconbtn" data-act="week" data-n="1" aria-label="Next week">›</button></div>';
  out+='<div class="grid12" aria-label="Weekly completion grid">'+grid+'</div><p class="muted small" style="margin:0">Rows are weeks, dots are Monday to Saturday. Filled means done, slashed means missed, faded means still to come. Tap a week label to focus it. D marks deload weeks.</p>';

  // body
  var bw=Object.keys(state.logs).sort().filter(function(d){return state.logs[d].m&&state.logs[d].m.weight>0}).map(function(d){return {x:d,y:state.logs[d].m.weight}});
  out+='<h2>Body weight</h2>'+(bw.length?lineChart(bw,'kg'):'<p class="muted small">Log your weight in Today. Once a week, same time, is enough.</p>');
  var rec=Object.keys(state.logs).sort().reverse().filter(function(d){var m=state.logs[d].m||{};return m.weight||m.sleep||m.protein}).slice(0,7);
  if(rec.length) out+='<div class="scroll-x"><table class="tbl" style="min-width:300px"><tr><th>Date</th><th>kg</th><th>Sleep</th><th>Protein</th></tr>'+rec.map(function(d){var m=state.logs[d].m||{};return '<tr><td>'+esc(fmtShort(d))+'</td><td>'+fnum(m.weight)+'</td><td>'+(m.sleep!=null?fnum(m.sleep)+' h':'')+'</td><td>'+(m.protein!=null?fnum(m.protein)+' g':'')+'</td></tr>'}).join('')+'</table></div>';

  // lifts
  var ids={};
  Object.keys(state.logs).forEach(function(d){var ex=state.logs[d].ex||{};Object.keys(ex).forEach(function(id){if(ex[id].some(function(s){return s&&s.d})) ids[id]=1})});
  var list=Object.keys(ids).filter(function(id){return EXMAP[id]});
  out+='<h2>Lift progress</h2>';
  if(!list.length) out+='<p class="muted small">Log a set in Today and your lifts show up here.</p>';
  else {
    list.sort(function(a,b){return EXMAP[a].name.localeCompare(EXMAP[b].name)});
    if(!ui.liftSel||!ids[ui.liftSel]) ui.liftSel=ids.bench?'bench':list[0];
    out+='<select class="sel" data-act="lift-sel" aria-label="Choose a lift">'+list.map(function(id){return '<option value="'+id+'"'+(id===ui.liftSel?' selected':'')+'>'+esc(EXMAP[id].name)+' ('+EXMAP[id].day+')</option>'}).join('')+'</select>';
    var pts=[],rows=[],kind='kg';
    Object.keys(state.logs).sort().forEach(function(d){
      var arr=((state.logs[d].ex||{})[ui.liftSel]||[]).filter(function(s){return s&&s.d});
      if(!arr.length) return;
      var best=arr.map(function(s){return score(EXMAP[ui.liftSel],s)}).sort(function(a,b){return b.v-a.v})[0];
      kind=best.kind; pts.push({x:d,y:+best.v.toFixed(1)});
      var u=U[EXMAP[ui.liftSel].u]||U.kg;
      rows.push('<tr><td>'+esc(fmtShort(d))+'</td><td>'+arr.map(function(s){return (u.a&&s.w!=null?fnum(s.w)+' × ':'')+(s.r==null?'?':s.r)}).join(',  ')+'</td></tr>');
    });
    out+='<p class="muted small" style="margin:8px 0 0">'+(kind==='kg'?'Best set each session, as estimated one-rep max (kg).':'Best set each session (reps).')+'</p>'+lineChart(pts,kind==='kg'?'kg':'reps');
    out+='<div class="scroll-x"><table class="tbl" style="min-width:280px"><tr><th>Date</th><th>Sets</th></tr>'+rows.reverse().slice(0,10).join('')+'</table></div>';
  }

  // recent
  var recent=Object.keys(state.logs).sort().reverse().filter(function(d){var pr=dayProgress(d);return pr.done>0||state.logs[d].finished}).slice(0,10);
  out+='<h2>Recent sessions</h2>'+(recent.length?recent.map(function(d){var p=planFor(d),pr=dayProgress(d);return '<button type="button" class="logrow" data-act="open-day" data-date="'+d+'"><span class="a">'+esc(fmtLong(d))+' · '+esc(p.day.t)+'</span><span class="b">'+(pr.complete?'Done':pr.done+' of '+pr.total)+'</span></button>'}).join(''):'<p class="muted small">Nothing logged yet.</p>');

  // settings
  out+='<h2>Program start</h2><p class="muted small" style="margin:0">Week 1 began '+esc(fmtLong(startMon))+'. Changing this shifts which week each date belongs to; your logs stay on their dates.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input type="date" id="startPick" value="'+startMon+'" style="height:44px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;background:var(--field)"><button type="button" class="btn ghost" data-act="start-set">Change start</button></div>';
  out+='<h2>Backup</h2><p class="muted small" style="margin:0">'+(store.mode==='db'?'Your log is saved to your account. You can still keep a copy.':'Your log lives in this browser only. Copy a backup now and then. Paste it back here to restore on another device or after clearing your browser.')+'</p>'
    +'<div style="margin-top:8px"><button type="button" class="btn ghost" data-act="backup-copy">Copy backup</button></div>'
    +'<label class="fld" style="margin-top:12px"><span>Paste a backup to restore</span><textarea id="restoreBox" placeholder="Paste backup text here"></textarea></label>'
    +'<div style="margin-top:8px"><button type="button" class="btn ghost" data-act="backup-restore">Restore from backup</button></div>'
    +'<p class="small muted" id="bkmsg" role="status" style="margin:8px 0 0"></p>';
  return out;
}

function render(){
  var app=$('#app'), h='';
  if(ui.tab==='today') h=todayView(); else if(ui.tab==='plan') h=planView(); else h=progressView();
  app.innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(b){
    if(b.dataset.tab===ui.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
}

/* ---------- interactions ---------- */
function setField(date,path,val){
  var log=ensureLog(date), parts=path.split(':');
  if(parts[0]==='ex'){
    var id=parts[1], i=+parts[2], f=parts[3];
    var arr=log.ex[id]||(log.ex[id]=[]);
    while(arr.length<=i) arr.push({w:null,r:null,d:false});
    arr[i][f]=val;
  } else if(parts[0]==='cardio'||parts[0]==='m'){ log[parts[0]][parts[1]]=val; }
  else log[parts[0]]=val;
  scheduleSave(date);
}
function refreshDay(){
  var pr=dayProgress(ui.date);
  var t=$('#dayprogtxt'), b=$('#dayprogbar'), s=$('#strip');
  if(t) t.textContent=pr.done+' of '+pr.total+' done';
  if(b) b.style.width=pr.pct+'%';
  if(s) s.innerHTML=stripHtml();
}
function refreshPlaceholders(id){
  var sec=document.querySelector('[data-exsec="'+id+'"]'); if(!sec) return;
  Array.prototype.forEach.call(sec.querySelectorAll('.set'),function(row){
    var i=+row.dataset.i, sug=suggestSet(ui.date,id,i), ins=row.querySelectorAll('input');
    if(ins[0]) ins[0].placeholder=sug.w!=null?fnum(sug.w):'';
    if(ins[1]) ins[1].placeholder=sug.r!=null?String(sug.r):'';
  });
}

var rest={end:0,total:0,iv:null,muted:false,ctx:null,hideT:null};
try{rest.muted=localStorage.getItem('gymrest:mute')==='1'}catch(e){}
function unlockAudio(){try{rest.ctx=rest.ctx||new (window.AudioContext||window.webkitAudioContext)();if(rest.ctx.state==='suspended') rest.ctx.resume()}catch(e){}}
function beep(){
  if(!rest.muted&&rest.ctx){try{var o=rest.ctx.createOscillator(),g=rest.ctx.createGain();o.connect(g);g.connect(rest.ctx.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(rest.ctx.currentTime+.25)}catch(e){}}
  try{if(navigator.vibrate) navigator.vibrate([120,80,120])}catch(e){}
}
function fmtT(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60)}
function paintRest(){
  var left=(rest.end-Date.now())/1000;
  $('#resttime').textContent=fmtT(left);
  $('#restfill').style.width=Math.max(0,Math.min(100,left/rest.total*100))+'%';
  if(left<=0){
    clearInterval(rest.iv);rest.iv=null;beep();
    $('#restlabel').textContent='Go. Next set.';
    clearTimeout(rest.hideT);rest.hideT=setTimeout(function(){$('#rest').hidden=true},4000);
  }
}
function startRest(secs,label){
  rest.total=secs;rest.end=Date.now()+secs*1000;
  $('#restlabel').textContent='Rest · '+label; $('#restmute').textContent=rest.muted?'🔇':'🔊';
  $('#rest').hidden=false; clearTimeout(rest.hideT); clearInterval(rest.iv);
  paintRest(); rest.iv=setInterval(paintRest,250);
}
$('#rest').addEventListener('click',function(e){
  var b=e.target.closest('[data-rest]'); if(!b) return; var a=b.dataset.rest;
  if(a==='skip'){clearInterval(rest.iv);rest.iv=null;clearTimeout(rest.hideT);$('#rest').hidden=true}
  else if(a==='mute'){rest.muted=!rest.muted;b.textContent=rest.muted?'🔇':'🔊';try{localStorage.setItem('gymrest:mute',rest.muted?'1':'0')}catch(err){}}
  else{rest.end+=(+a)*1000;rest.total=Math.max(rest.total,(rest.end-Date.now())/1000);if(!rest.iv){rest.iv=setInterval(paintRest,250)}paintRest()}
});

var app=$('#app');
app.addEventListener('input',function(e){
  var t=e.target, path=t.dataset&&t.dataset.p; if(!path) return;
  var v=t.value;
  if(t.type==='number'){v=v===''?null:(isFinite(+v)?+v:null)}
  setField(ui.date,path,v);
  if(path.indexOf('ex:')===0||path.indexOf('cardio:')===0) refreshDay();
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.act==='lift-sel'){ui.liftSel=t.value;render();return}
  var path=t.dataset&&t.dataset.p; if(!path) return;
  if(t.tagName==='SELECT'){setField(ui.date,path,t.value)}
});
app.addEventListener('focusout',function(){
  setTimeout(function(){
    var a=document.activeElement;
    if(store.dirtyRender&&!(a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){store.dirtyRender=false;render()}
  },50);
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.tagName==='SELECT') return;
  var a=b.dataset.act;
  if(a==='toggle-set'){
    var id=b.dataset.ex,i=+b.dataset.i, log=ensureLog(ui.date), arr=log.ex[id]||(log.ex[id]=[]);
    while(arr.length<=i) arr.push({w:null,r:null,d:false});
    var s=arr[i]; s.d=!s.d;
    var row=b.closest('.set'), ins=row.querySelectorAll('input');
    if(s.d){
      var sug=suggestSet(ui.date,id,i);
      if(s.w==null&&sug.w!=null){s.w=sug.w;ins[0].value=fnum(sug.w)}
      if(s.r==null&&sug.r!=null){s.r=sug.r;ins[1].value=String(sug.r)}
      unlockAudio();
      var info=EXMAP[id]||{name:'set',tier:'iso'};
      startRest(REST[info.tier||'iso'].s,info.name);
    }
    b.setAttribute('aria-pressed',s.d?'true':'false'); row.classList.toggle('on',s.d);
    scheduleSave(ui.date); refreshDay(); refreshPlaceholders(id);
  }
  else if(a==='add-set'){var l2=ensureLog(ui.date),ar=l2.ex[b.dataset.ex]||(l2.ex[b.dataset.ex]=[]);var p0=planFor(ui.date),e0=p0.exs.filter(function(x){return x.id===b.dataset.ex})[0];while(ar.length<(e0?e0.sets:0)) ar.push({w:null,r:null,d:false});ar.push({w:null,r:null,d:false});scheduleSave(ui.date);render()}
  else if(a==='copy-last'){
    var ex=b.dataset.ex,last=lastFor(ex,ui.date); if(!last) return;
    var l3=ensureLog(ui.date); l3.ex[ex]=last.sets.map(function(s){return {w:s.w,r:s.r,d:false}});
    scheduleSave(ui.date);render();
  }
  else if(a==='week'){ui.date=addDays(ui.date,7*(+b.dataset.n));render()}
  else if(a==='goto-day'){ui.date=b.dataset.date;render()}
  else if(a==='open-day'){ui.date=b.dataset.date;ui.tab='today';render();window.scrollTo(0,0)}
  else if(a==='toggle-bool'){var l4=ensureLog(ui.date),f=b.dataset.f;l4[f]=!l4[f];b.setAttribute('aria-pressed',l4[f]?'true':'false');scheduleSave(ui.date)}
  else if(a==='finish'){var l5=ensureLog(ui.date);l5.finished=!l5.finished;b.textContent=l5.finished?'Session marked done. Tap to undo':'Mark session done';scheduleSave(ui.date);refreshDay()}
  else if(a==='plan-sec'){ui.planSec=b.dataset.s;render();}
  else if(a==='drive-connect'){ connectDrive(); }
  else if(a==='backup-copy'){
    var txt=JSON.stringify({app:'gymlog',v:1,start:state.start,logs:state.logs});
    var bx=$('#restoreBox'), bm=$('#bkmsg');
    var fin=function(ok){
      bm.textContent=ok?'Backup copied. Paste it somewhere safe, like a note to yourself.':'Could not copy automatically. The backup is in the box below: select all and copy it.';
      if(!ok&&bx){bx.value=txt;bx.focus();bx.select()}
    };
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){fin(true)},function(){fin(false)})} else fin(false) }catch(err){fin(false)}
  }
  else if(a==='backup-restore'){
    var rb=$('#restoreBox'), raw=((rb&&rb.value)||'').trim(), msgText;
    if(!raw){$('#bkmsg').textContent='Paste a backup first.';return}
    try{
      var o=JSON.parse(raw), okDate=function(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)};
      if(!o||typeof o.logs!=='object'||o.logs===null||Array.isArray(o.logs)) throw new Error('bad');
      var n=0;
      Object.keys(o.logs).forEach(function(d){ if(okDate(d)&&o.logs[d]&&typeof o.logs[d]==='object'){state.logs[d]=o.logs[d];ensureLog(d);state.logs[d].date=d;scheduleSave(d);n++} });
      if(okDate(o.start)){state.start=o.start;saveStart()}
      msgText='Restored '+n+' day'+(n===1?'':'s')+'.';
    }catch(err){ msgText='That does not look like a backup from this app.' }
    render(); var bm2=$('#bkmsg'); if(bm2) bm2.textContent=msgText;
  }
  else if(a==='pick-week'){
    var sm=mondayOf(state.start||todayStr());
    ui.date=addDays(sm,(+b.dataset.n-1)*7+dowOf(ui.date)); render();
  }
  else if(a==='start-set'){
    var pk=$('#startPick'); if(!pk||!pk.value) return;
    state.start=mondayOf(pk.value); saveStart(); ui.date=todayStr(); render();
  }
});
Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(b){
  b.addEventListener('click',function(){ui.tab=b.dataset.tab;render();window.scrollTo(0,0)});
});

var DRIVE_FOLDER_ID = '1BYoF7tGYbTYDXgg9riKAhVLhYzNTY_hO';
var DRIVE_CLIENT_ID = '271031247788-m2k3ah6a7pp8sgq2ejtv8dg9lfkn8rdb.apps.googleusercontent.com';
var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

var driveToken = null;
var driveTokenExp = 0;

function photoMsg(t){ var m=$('#photoMsg'); if(m) m.textContent=t; }

function isInAppBrowser(){
  var ua = navigator.userAgent || '';
  if(/Instagram/i.test(ua)) return 'Instagram';
  if(/FBAN|FBAV/i.test(ua)) return 'Facebook';
  if(/WhatsApp/i.test(ua)) return 'WhatsApp';
  if(/musical_ly|BytedanceWebview/i.test(ua)) return 'TikTok';
  if(/GSA\//i.test(ua)) return 'the Google app';
  if(/\bwv\b/i.test(ua) && /Chrome/i.test(ua)) return 'an in-app browser';
  return null;
}

function connectDrive(){
  if(!window.google || !google.accounts || !google.accounts.oauth2){
    photoMsg('Google script still loading. Wait 2 seconds and tap again.');
    return;
  }
  var inApp = isInAppBrowser();
  if(inApp){
    photoMsg('You are in ' + inApp + '. Open this page in Chrome or Safari — Google sign-in does not work in in-app browsers.');
    return;
  }
  photoMsg('Opening Google sign-in…');
  try{
    google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: function(resp){
        if(resp.error){
          photoMsg('Sign-in failed: ' + resp.error);
          return;
        }
        driveToken = resp.access_token;
        driveTokenExp = Date.now() + ((resp.expires_in || 3600) * 1000) - 60000;
        render();
        photoMsg('✓ Connected. Tap the photo button to take your pic.');
      },
      error_callback: function(){
        photoMsg('Sign-in popup was blocked. Allow popups for this site, then tap again.');
      }
    }).requestAccessToken();
  }catch(e){
    photoMsg('Sign-in failed: ' + (e.message || e));
  }
}

// Silent token refresh on page load — works for repeat users who already consented
function silentDriveAuth(){
  if(!window.google || !google.accounts || !google.accounts.oauth2) return;
  if(isInAppBrowser()) return;
  try{
    google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: function(resp){
        if(resp && resp.access_token){
          driveToken = resp.access_token;
          driveTokenExp = Date.now() + ((resp.expires_in || 3600) * 1000) - 60000;
          if(ui.tab === 'today') render();
        }
      }
    }).requestAccessToken({prompt: ''});
  }catch(e){ /* silent fail is fine */ }
}

// File selected → upload using the stored token
document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'photoInput'){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!driveToken || Date.now() > driveTokenExp){
      photoMsg('Session expired. Tap Connect Google Drive again.');
      render();
      return;
    }
    uploadToDrive(file, ui.date);
    e.target.value = '';
  }
});

function uploadToDrive(file, dateStr){
  photoMsg('Uploading ' + Math.round(file.size / 1024) + ' KB…');
  var fileName = 'progress_' + dateStr + '.jpg';
  var metadata = { name: fileName, parents: [DRIVE_FOLDER_ID] };
  var form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
  form.append('file', file, fileName);

  fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + driveToken },
    body: form
  })
  .then(function(r){
    if(r.status === 401){
      driveToken = null;
      throw new Error('Session expired. Tap Connect Google Drive again.');
    }
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(data){
    photoMsg('✓ Saved: ' + data.name);
    console.log('Drive file:', data.webViewLink);
  })
  .catch(function(err){
    photoMsg('Upload failed: ' + err.message);
  });
}

// Try a silent token refresh 1.5s after load (works if you've signed in before)
setTimeout(silentDriveAuth, 1500);

render();
initStorage();
})();
